<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/varzea-simulator.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Várzea Simulator</title>
</head>
<body onload="carregarTimes()">
    <button class="btnCanto" id="btnAbrirMenu" onclick="abrirMenu()"><i class="fa-solid fa-bars"></i></button>
    <menu>
        <button class="btnMenu" onclick="irParaPagina('index.html')"><i class="fa-solid fa-users"></i> Times</button>
        <button class="btnMenu" onclick="irParaPagina('partida.html')"><i class="fa-solid fa-futbol"></i> Jogar</button>
        <button class="btnMenu" onclick="irParaPagina('configuracoes.html')"><i class="fa-solid fa-gear"></i> Configurações</button>
        <button class="btnMenu" onclick="fecharMenu()"><i class="fa-solid fa-reply"></i> Fechar</button>
    </menu>
    
    <main>
        <div id="botoesMain">
            <button class="botaoMain" id="criarTimeBtn" onclick="abrirJanela('formulario')"><i class="fa-solid fa-plus"></i> Criar Time</button>
            <button class="botaoMain" onclick="irParaPagina('jogadores.html')"><i class="fa-solid fa-people-group"></i> Jogadores</button>
        </div>
        <div id="timesDiv">
            
        </div>
    </main>
    <div id="janela-modal">
        <div id="formularioDiv" class="divJanela">
            <button onclick="fecharJanela('formulario')" class="botaoSairJanela"><i class="fa-solid fa-x" aria-hidden="true"></i></button>
            <div id="nomeTimeDiv" class="inputDiv">
                <label for="nomeTime-formulario">Nome</label>
                <input type="text" id="nomeTime-formulario" placeholder="Nome do time">
            </div>
            <div id="escudoTimeDiv" class="inputDiv">
                <label for="escudoTime-formulario">Escudo</label>
                <input type="text" id="escudoTime-formulario" placeholder="Escudo URL(Opcional)">
            </div>
            <div id="torcidaTimeDiv" class="inputDiv">
                <label for="torcidaTime-formulario">Torcida</label>
                <input type="text" id="torcidaTime-formulario" placeholder="Imagem Torcida URL(Opcional)">
            </div>
            <div id="coresDiv">
                <div id="cor1Div">
                    <label for="cor1-formulario">Cor 1</label>
                    <input type="color" id="cor1-formulario">
                </div>
                <div id="cor2Div">
                    <label for="cor2-formulario">Cor 2</label>
                    <input type="color" id="cor2-formulario">
                </div>
            </div>
            <div id="taticasTime">
                <div class="taticaDiv">
                    <label for="estiloJogo">Estilo de Jogo</label>
                    <select name="estiloJogo" id="estiloJogo">
                        <option value="nenhum">Nenhum</option>
                        <option value="neutro">Neutro</option>
                        <option value="ofensivo">Ofensivo</option>
                        <option value="defensivo">Defensivo</option>
                    </select>
                </div>
                <div class="taticaDiv">
                    <label for="modoAtaque">Modo de ataque</label>
                    <select name="modoAtaque" id="modoAtaque">
                        <option value="nenhum">Nenhum</option>
                        <option value="trocaPasses">Troca de Passe</option>
                        <option value="cruzamentos">Com cruzamentos</option>
                        <option value="contraAtaque">Contra-ataque</option>
                        <option value="pontas">Pelas pontas</option>
                    </select>
                </div>
                <div class="taticaDiv">
                    <label for="modoDefesa">Modo de defesa</label>
                    <select name="modoDefesa" id="modoDefesa">
                        <option value="nenhum">Nenhum</option>
                        <option value="zona">Por zona</option>
                        <option value="individual">Marcação Individual</option>
                        <option value="pressaoAlta">Pressão Alta</option>
                        <option value="linhaImpedimento">Linha de impedimento</option>
                    </select>
                </div>
            </div>
            <button id="botaoConfirmarFormulario" onclick="registrarTime()">Confirmar</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script src="https://kit.fontawesome.com/3802d20ec1.js" crossorigin="anonymous"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/varzea-simulator.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/time.css">
    <title>Perfil Time</title>
</head>
<body onload="carregarPaginaTime(false)">
    <button class="btnCanto" id="btnAbrirMenu" onclick="abrirMenu()"><i class="fa-solid fa-bars"></i></button>
    <menu>
        <button class="btnMenu" onclick="irParaPagina('index.html')"><i class="fa-solid fa-users"></i> Times</button>
        <button class="btnMenu" onclick="irParaPagina('partida.html')"><i class="fa-solid fa-futbol"></i> Jogar</button>
        <button class="btnMenu" onclick="irParaPagina('configuracoes.html')"><i class="fa-solid fa-gear"></i> Configurações</button>
        <button class="btnMenu" onclick="fecharMenu()"><i class="fa-solid fa-reply"></i> Fechar</button>
    </menu>
    <section id="informacoesBasicas">
        <div id="nomeTimeDiv">
            <label for="nomeTime">Nome</label>
            <input type="text" id="nomeTime" placeholder="Nome do time">
        </div>
        <div id="coresDiv">
            <div id="cor1Div">
                <label for="cor1">Cor 1</label>
                <input type="color" id="cor1">
            </div>
            <div id="cor2Div">
                <label for="cor2">Cor 2</label>
                <input type="color" id="cor2">
            </div>
        </div>
        <button id="botaoConfirmarAlteracoes" onclick="editarTime()">Salvar Alterações</button>
    </section>
    <section id="informacoesAvancadas">
        <div id="configuracoesTimeDiv">
            <div id="taticasTime">
                <div class="taticaDiv">
                    <label for="estiloJogo">Estilo de Jogo</label>
                    <select name="estiloJogo" id="estiloJogo">
                        <option value="nenhum">Nenhum</option>
                        <option value="neutro">Neutro</option>
                        <option value="ofensivo">Ofensivo</option>
                        <option value="defensivo">Defensivo</option>
                    </select>
                </div>
                <div class="taticaDiv">
                    <label for="modoAtaque">Modo de ataque</label>
                    <select name="modoAtaque" id="modoAtaque">
                        <option value="nenhum">Nenhum</option>
                        <option value="trocaPasses">Troca de Passe</option>
                        <option value="cruzamentos">Com cruzamentos</option>
                        <option value="contraAtaque">Contra-ataque</option>
                        <option value="pontas">Pelas pontas</option>
                    </select>
                </div>
                <div class="taticaDiv">
                    <label for="modoDefesa">Modo de defesa</label>
                    <select name="modoDefesa" id="modoDefesa">
                        <option value="nenhum">Nenhum</option>
                        <option value="zona">Por zona</option>
                        <option value="individual">Marcação Individual</option>
                        <option value="pressaoAlta">Pressão Alta</option>
                        <option value="linhaImpedimento">Linha de impedimento</option>
                    </select>
                </div>
                <div class="taticaDiv">
                    <label for="formacao">Formação</label>
                    <select name="formacao" id="formacao" onchange="carregarPaginaTime(true)">
                        <option value="122">1-2-2</option>
                        <option value="212">2-1-2</option>
                        <option value="221">2-2-1</option>
                        <option value="311">3-1-1</option>
                        <option value="131">1-3-1</option>
                        <option value="113">1-1-3</option>
                    </select>
                </div>
            </div>
            <section id="campoTatico">
                <div class="linha ataque"></div>
                <div class="linha meio"></div>
                <div class="linha defesa"></div>

                <div class="linha goleiro">
                    <div class="posicao GK">
                        <span class="funcao">Goleiro</span>
                    </div>
                </div>
            </section>
        </div>
        <div id="reservasDiv">
            <h2>Reservas</h2>
        </div>
    </section>

    <script src="js/app.js"></script> 
    <script src="https://kit.fontawesome.com/3802d20ec1.js" crossorigin="anonymous"></script>
</body>
</html>
